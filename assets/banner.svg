  <text x="96" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#9fb6aa">A local-first knowledge base for AI agents — now growing inside VS Code.</text>
  <text x="96" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2" fill="#6f8579">MIT  ·  MCP-NATIVE  ·  NO CLOUD, NO TELEMETRY</text>

