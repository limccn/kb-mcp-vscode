<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="hi, seedling — hyseed for VS Code">

  <defs>
    <radialGradient id="glow" cx="230" cy="150" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c985a" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#1c985a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1c985a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3ddc8a" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#0b0f0d" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0f0d" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="420" fill="#0b0f0d"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>
  <rect width="1600" height="420" fill="url(#vignette)"/>

  <g filter="url(#soft)" opacity="0.55">
    <circle cx="1290" cy="208" r="128" fill="none" stroke="#1c985a" stroke-width="2"/>
  </g>

